<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSOT Club & Activities — Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark-1: #112d5e;
      --bg-dark-2: #0b1d3a;
      --bg-dark-3: #060f1e;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-cyan: #38bdf8;
      --text-muted: #64748b;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 25% 30%, var(--bg-dark-1) 0%, var(--bg-dark-2) 48%, var(--bg-dark-3) 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Hand-drawn Chalk Accents */
    .doodle {
      position: absolute;
      font-family: 'Caveat', cursive;
      color: rgba(255, 255, 255, 0.88);
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }

    .doodle-top-right {
      top: 24px;
      right: 48px;
      font-size: 26px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: rotate(2deg);
    }

    .doodle-bottom-left {
      bottom: 24px;
      left: 44px;
      font-size: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: rotate(-3deg);
    }

    .doodle svg {
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    /* Main Container Split */
    .portal-container {
      width: 100%;
      max-width: 1140px;
      display: grid;
      grid-template-columns: 1.15fr 0.95fr;
      gap: 48px;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    /* Left Showcase Section */
    .showcase-section {
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding-right: 12px;
    }

    /* Modern Geometric Emblem (No Cat Face) */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 50%, #7c3aed 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(14, 165, 233, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #ffffff;
    }

    .headline-block h1 {
      font-size: clamp(34px, 4.4vw, 50px);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.8px;
      margin-bottom: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #e0f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .headline-block p {
      font-size: 17px;
      color: #bae6fd;
      line-height: 1.5;
      max-width: 460px;
    }

    /* Segmented Pill Switcher */
    .pill-switcher {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 5px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      width: fit-content;
      gap: 4px;
    }

    .pill-btn {
      padding: 9px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.22s ease;
      color: #e2e8f0;
      background: transparent;
    }

    .pill-btn.active {
      background: #e0f2fe;
      color: #0c4a6e;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
    }

    /* Stylized Hoodie Mascot */
    .mascot-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    .mascot-glow {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.32) 0%, rgba(37, 99, 235, 0) 70%);
      filter: blur(28px);
      z-index: 0;
    }

    .mascot-svg {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.45));
    }

    /* Right Auth Card */
    .auth-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 38px 36px;
      color: #0f172a;
      box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.42), 0 0 1px 1px rgba(255, 255, 255, 0.15);
      width: 100%;
      max-width: 430px;
      margin-left: auto;
    }

    .auth-header {
      margin-bottom: 24px;
    }

    .auth-header h2 {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .auth-header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 18px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 13px 42px 13px 44px;
      font-size: 14px;
      font-family: inherit;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      background: #ffffff;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.2s ease;
    }

    .toggle-password:hover {
      color: #475569;
    }

    .forgot-link-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: -6px;
      margin-bottom: 20px;
    }

    .forgot-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-blue);
      text-decoration: none;
      transition: color 0.18s;
    }

    .forgot-link:hover {
      color: var(--accent-blue-hover);
      text-decoration: underline;
    }

    /* Primary Submit Button */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: var(--accent-blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.45);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    /* Social Auth Icons */
    .social-auth-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    /* Footer Switch Link */
    .card-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }

    /* Responsive Queries */
    @media (max-width: 960px) {
      body {
        padding: 60px 16px 40px;
      }
      .portal-container {
        grid-template-columns: 1fr;
        gap: 36px;
      }
      .showcase-section {
        align-items: center;
        text-align: center;
        padding-right: 0;
      }
      .brand-header {
        justify-content: center;
      }
      .headline-block p {
        margin: 0 auto;
      }
      .pill-switcher {
        margin: 0 auto;
      }
      .mascot-wrapper {
        height: 220px;
      }
      .auth-card {
        margin: 0 auto;
      }
      .doodle-top-right {
        top: 14px;
        right: 18px;
        font-size: 20px;
      }
      .doodle-bottom-left {
        display: none;
      }
    }

    /* Inline Alert Notifications */
    .auth-alert {
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      animation: alertSlideIn 0.22s ease-out;
      line-height: 1.4;
    }

    @keyframes alertSlideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* Demo Quick-Fill Bar */
    .demo-accounts-bar {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
      text-align: center;
    }

    .demo-accounts-title {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .demo-chips-grid {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .demo-chip {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 11.5px;
      font-weight: 600;
      color: #334155;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .demo-chip:hover {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- Top Right Chalk Doodle -->
  <div class="doodle doodle-top-right">
    <span>Same People, Different Clubs, One Community</span>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
      <path d="M4 19c4 3 12 3 16 0"/>
    </svg>
  </div>

  <!-- Bottom Left Chalk Doodle -->
  <div class="doodle doodle-bottom-left">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 4l3 12h14l3-12-5 4-5-6-5 6-5-4z"/>
      <circle cx="12" cy="19" r="1"/>
    </svg>
    <span>Good Vibes Only :)</span>
  </div>

  <main class="portal-container">
    <!-- Left Hero & Branding -->
    <section class="showcase-section">
      <!-- Clean Geometric MSOT Tech Emblem -->
      <div class="brand-header">
        <div class="brand-logo" aria-label="MSOT Logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M4 18V6L12 12L20 6V18" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="2" fill="#38bdf8"/>
          </svg>
        </div>
        <span class="brand-title">MSOT Club & Activities</span>
      </div>

      <div class="headline-block">
        <h1>Clubs. Friends.<br>Memories.</h1>
        <p>Join clubs, discover your vibe, become the best version of you!</p>
      </div>

      <!-- Segmented Pill Switcher -->
      <div class="pill-switcher" role="tablist">
        <button id="tabLogin" class="pill-btn active" onclick="switchMode('login')">Login</button>
        <button id="tabSignup" class="pill-btn" onclick="switchMode('signup')">Sign Up</button>
      </div>

      <!-- Vector Mascot: Cool Student wearing Sunglasses & Hoodie -->
      <div class="mascot-wrapper">
        <div class="mascot-glow"></div>
        <svg class="mascot-svg" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Sparkle Accents -->
          <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85">
            <path d="M70 90V74M62 82H78" />
            <path d="M330 140V124M322 132H338" />
            <path d="M310 50V38M304 44H316" />
          </g>

          <!-- Hoodie Torso -->
          <path d="M125 295C125 240 150 205 200 205C250 205 275 240 275 295H125Z" fill="#1d4ed8"/>
          <path d="M145 295C150 250 170 220 200 220C230 220 250 250 255 295H145Z" fill="#2563eb"/>

          <!-- Drawstrings -->
          <path d="M185 220V260" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
          <path d="M215 220V255" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
          <circle cx="185" cy="262" r="2.5" fill="#ffffff"/>
          <circle cx="215" cy="257" r="2.5" fill="#ffffff"/>

          <!-- Head & Hood -->
          <ellipse cx="200" cy="145" rx="72" ry="76" fill="#1e40af"/>
          <ellipse cx="200" cy="148" rx="58" ry="60" fill="#fbcfe8"/>

          <!-- Hair Fringe -->
          <path d="M152 130C165 105 235 105 248 130C235 120 220 120 200 124C180 120 165 120 152 130Z" fill="#1e293b"/>

          <!-- Sunglasses -->
          <path d="M155 136H245C248 136 250 138 250 141V152C250 162 240 170 228 170H214C206 170 202 166 200 164C198 166 194 170 186 170H172C160 170 150 162 150 152V141C150 138 152 136 155 136Z" fill="#0f172a"/>
          <!-- Lens Reflections -->
          <path d="M158 143L175 163H165L154 148V143H158Z" fill="#38bdf8" opacity="0.9"/>
          <path d="M218 143L235 163H225L214 148V143H218Z" fill="#38bdf8" opacity="0.9"/>

          <!-- Confident Grin -->
          <path d="M188 182C194 188 206 188 212 182" stroke="#9d174d" stroke-width="3" stroke-linecap="round"/>

          <!-- Thumbs-up Hand -->
          <g transform="translate(255, 205)">
            <ellipse cx="22" cy="30" rx="18" ry="18" fill="#fbcfe8"/>
            <path d="M16 20C16 10 24 8 26 14L28 24" stroke="#fbcfe8" stroke-width="10" stroke-linecap="round"/>
            <circle cx="28" cy="22" r="5" fill="#f472b6"/>
            <!-- Sparkles off thumb -->
            <path d="M38 12L44 8M42 22L48 24" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
    </section>

    <!-- Right White Auth Card -->
    <section class="auth-card" aria-label="Authentication Form">
      <div class="auth-header">
        <h2 id="cardTitle">Welcome Back!</h2>
        <p id="cardSubtitle">Log in to your club account</p>
      </div>

      <!-- Inline Notification Alert -->
      <div id="authAlert" class="auth-alert" style="display: none;"></div>

      <form id="authForm" onsubmit="handleFormSubmit(event)">
        <!-- Email or Student ID -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" id="credentialInput" class="form-input" placeholder="Email or Student ID" required autocomplete="username" />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="passwordInput" class="form-input" placeholder="Password" required autocomplete="current-password" />
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
              <!-- Eye Icon -->
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Forgot Password -->
        <div class="forgot-link-wrap" id="forgotWrap">
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="submit-btn">Log In</button>
      </form>

      <!-- Quick Demo Logins -->
      <div class="demo-accounts-bar">
        <span class="demo-accounts-title">Quick Demo Logins</span>
        <div class="demo-chips-grid">
          <button type="button" class="demo-chip" onclick="quickFill('student@msot.edu', 'student123')">Student</button>
          <button type="button" class="demo-chip" onclick="quickFill('committee@msot.edu', 'admin123')">Club Committee (Pres & VP)</button>
          <button type="button" class="demo-chip" onclick="quickFill('faculty@msot.edu', 'faculty123')">Faculty</button>
        </div>
      </div>

      <!-- Alternate Divider -->
      <div class="divider">or</div>

      <!-- Social Logins (Google, Student Portal / Cap, Microsoft) -->
      <div class="social-auth-grid">
        <!-- Google -->
        <button type="button" class="social-btn" title="Sign in with Google">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
        </button>

        <!-- Student Portal / Academic Cap -->
        <button type="button" class="social-btn" title="Sign in with Student Portal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </button>

        <!-- Microsoft -->
        <button type="button" class="social-btn" title="Sign in with Microsoft">
          <svg width="19" height="19" viewBox="0 0 21 21">
            <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
            <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
            <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
          </svg>
        </button>
      </div>

      <!-- Footer Mode Toggle Link -->
      <div class="card-footer">
        <span id="footerPrompt">Don't have an account?</span>
        <a href="javascript:void(0)" id="footerActionLink" onclick="toggleModeFromFooter()">Sign Up</a>
      </div>
    </section>
  </main>

  <script>
    let currentMode = 'login';

    function switchMode(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tabLogin');
      const tabSignup = document.getElementById('tabSignup');
      const cardTitle = document.getElementById('cardTitle');
      const cardSubtitle = document.getElementById('cardSubtitle');
      const submitBtn = document.getElementById('submitBtn');
      const forgotWrap = document.getElementById('forgotWrap');
      const footerPrompt = document.getElementById('footerPrompt');
      const footerActionLink = document.getElementById('footerActionLink');

      if (mode === 'signup') {
        tabLogin.classList.remove('active');
        tabSignup.classList.add('active');
        cardTitle.textContent = 'Create an Account';
        cardSubtitle.textContent = 'Join the MSOT club community';
        submitBtn.textContent = 'Sign Up';
        forgotWrap.style.display = 'none';
        footerPrompt.textContent = 'Already have an account?';
        footerActionLink.textContent = 'Log In';
      } else {
        tabSignup.classList.remove('active');
        tabLogin.classList.add('active');
        cardTitle.textContent = 'Welcome Back!';
        cardSubtitle.textContent = 'Log in to your club account';
        submitBtn.textContent = 'Log In';
        forgotWrap.style.display = 'flex';
        footerPrompt.textContent = "Don't have an account?";
        footerActionLink.textContent = 'Sign Up';
      }
    }

    function toggleModeFromFooter() {
      switchMode(currentMode === 'login' ? 'signup' : 'login');
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('passwordInput');
      const eye = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        eye.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        pwd.type = 'password';
        eye.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    function showAlert(msg, type = 'error') {
      const alertBox = document.getElementById('authAlert');
      if (!alertBox) return;
      alertBox.className = `auth-alert ${type === 'success' ? 'alert-success' : 'alert-error'}`;
      alertBox.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;">
          ${type === 'success' 
            ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>' 
            : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}
        </svg>
        <span>${msg}</span>
      `;
      alertBox.style.display = 'flex';
    }

    function hideAlert() {
      const alertBox = document.getElementById('authAlert');
      if (alertBox) alertBox.style.display = 'none';
    }

    function quickFill(email, pwd) {
      if (currentMode !== 'login') switchMode('login');
      hideAlert();
      document.getElementById('credentialInput').value = email;
      document.getElementById('passwordInput').value = pwd;
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.style.transform = 'scale(1.02)';
      setTimeout(() => submitBtn.style.transform = '', 180);
      document.getElementById('credentialInput').focus();
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      hideAlert();

      const identifier = document.getElementById('credentialInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span style="display:inline-flex; align-items:center; gap:8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="animation: spin 0.8s linear infinite;">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.3"></circle>
            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path>
          </svg>
          Signing In...
        </span>
      `;

      // Support dynamic API target
      const apiHost = window.location.port === '8000' ? '' : 'http://127.0.0.1:8000';

      try {
        const res = await fetch(`${apiHost}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showAlert(data.detail || 'Invalid email or password. Please try again.', 'error');
          return;
        }

        // Store user identity & role in browser storage
        localStorage.setItem('user_session', JSON.stringify(data.user));

        showAlert(`Welcome back, ${data.user.name}! Redirecting to dashboard...`, 'success');

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);

      } catch (err) {
        showAlert('Cannot connect to authentication service. Ensure FastAPI server is running.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = currentMode === 'login' ? 'Log In' : 'Sign Up';
      }
    }
  </script>
</body>
</html>
